{% load static %}

<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>
        {% block title %}
            MediCare
        {% endblock %}
    </title>


    <!-- Google Fonts -->

    <link rel="preconnect"
          href="https://fonts.googleapis.com">

    <link rel="preconnect"
          href="https://fonts.gstatic.com"
          crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Outfit:wght@500;600;700&display=swap"
        rel="stylesheet"
    >


    <!-- Font Awesome -->

    <link
        rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css"
    >


    <!-- Project CSS -->

    <link
        rel="stylesheet"
        href="{% static 'consultancy/css/style.css' %}"
    >

</head>


<body>


    <!-- Background decoration -->

    <div class="background-circle circle-one"></div>

    <div class="background-circle circle-two"></div>


    <!-- Application -->

    <div class="app">


        <!-- Sidebar -->

        <aside class="sidebar">


            <!-- Logo -->

            <div class="brand">

                <div class="brand-icon">

                    <i class="fa-solid fa-heart-pulse"></i>

                </div>

                <div>

                    <h2>
                        MediCare
                    </h2>

                    <span>
                        Consultancy
                    </span>

                </div>

            </div>


            <!-- Navigation -->

            <nav class="navigation">

                {% block navigation %}
                {% endblock %}

            </nav>


            <!-- Bottom navigation -->

            <div class="navigation-bottom">

                {% block navigation_bottom %}
                {% endblock %}

            </div>


        </aside>


        <!-- Main -->

        <div class="main">


            <!-- Header -->

            <header class="topbar">

                {% block header %}
                {% endblock %}

            </header>


            <!-- Page -->

            <main class="content">

                {% block content %}
                {% endblock %}

            </main>


        </div>


    </div>


</body>

</html>
